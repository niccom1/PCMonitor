<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="mobile-web-app-capable" content="yes"><title>PCMonitor</title><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script></head><body><div id="stage"><main class="app" id="app"><button id="themeBtn" class="theme-btn" type="button" title="切换主题" aria-label="切换主题">◐</button><section class="row-a"><article class="card metric-card"><div class="card-title">CPU 占用率</div><div class="ring-wrap"><svg class="ring" viewBox="0 0 120 120"><circle class="ring-track" cx="60" cy="60" r="48"></circle><circle class="ring-progress" id="cpuProgress" cx="60" cy="60" r="48"></circle></svg><div class="ring-value" id="cpuValue">0%</div></div><div class="card-sub" id="cpuModel">未知 CPU</div></article><article class="card metric-card"><div class="card-title">GPU 占用率</div><div class="ring-wrap"><svg class="ring" viewBox="0 0 120 120"><circle class="ring-track" cx="60" cy="60" r="48"></circle><circle class="ring-progress" id="gpuProgress" cx="60" cy="60" r="48"></circle></svg><div class="ring-value" id="gpuValue">N/A</div></div><div class="card-sub" id="gpuModel">未知显卡</div></article><article class="card metric-card"><div class="card-title">内存占用率</div><div class="ring-wrap"><svg class="ring" viewBox="0 0 120 120"><circle class="ring-track" cx="60" cy="60" r="48"></circle><circle class="ring-progress" id="memoryProgress" cx="60" cy="60" r="48"></circle></svg><div class="ring-value" id="memoryValue">0%</div></div><div class="card-sub" id="memoryDetail">0.0 / 0.0 GB</div></article><article class="card net-card"><div class="card-title">网络状态</div><div class="net-line"><span class="label">上传速度</span><span class="value" id="netUp">0.00 mbps</span></div><div class="net-line"><span class="label">历史用量 <button id="resetBtn" class="reset-btn" title="清零" type="button">↻</button></span><span class="value" id="netHistory">0.00 GB</span></div><div class="net-line"><span class="label">下载速度</span><span class="value" id="netDown">0.00 mbps</span></div><div id="netChart" class="net-chart"></div></article></section><section class="row-b"><div class="clock" id="clock">2025年1月1日 08:08:08</div></section><div class="bottom-controls"><button id="fullscreenBtn" class="ctrl-btn" type="button" title="全屏" aria-label="全屏">⛶</button><button id="rotateBtn" class="ctrl-btn" type="button" title="横竖屏切换" aria-label="横竖屏切换">⟳</button></div><div class="error-message" id="errorMessage">无法连接服务端,请确认 PCMonitor 正在运行</div></main></div><div id="rotateHint"><span>请横屏使用</span><div class="rotate-hint-controls"><button id="hintFullscreenBtn" class="ctrl-btn" type="button" title="全屏" aria-label="全屏">⛶</button><button id="hintRotateBtn" class="ctrl-btn" type="button" title="横竖屏切换" aria-label="横竖屏切换">⟳</button></div></div><script defer src="/app.js"></script></body></html>
